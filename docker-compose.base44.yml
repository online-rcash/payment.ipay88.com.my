services:
  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    command: sh -c "npm install -g vite && vite --host 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    restart: unless-stopped

volumes:
  web_node_modules:
